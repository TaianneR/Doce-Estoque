<style>
:root{--roxo:#834e9e;--fram:#e93388;--fram2:#fde3f0;--pist:#f6eefa;--pist2:#d8c1e6;--choc:#2d1a38;--cinza:#76677f;--alerta:#c92a2a}
*{box-sizing:border-box}
body{margin:0;font-family:'Century Gothic',CenturyGothic,AppleGothic,Questrial,system-ui,sans-serif;font-synthesis:none;background:var(--pist);color:var(--choc);padding-bottom:76px;font-size:16px}
header{background:#fff;color:var(--choc);padding:8px 12px;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;border-bottom:3px solid var(--roxo)}
header img{height:58px;width:auto}
header select{flex:1;min-width:0;border:1.5px solid var(--pist2)}
.logo-login{display:block;margin:34px auto 0;width:210px;max-width:70%}
main{padding:6px 14px 20px;max-width:680px;margin:auto}
input,select,button{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--pist2);background:#fff;color:var(--choc);width:100%}
button{background:var(--fram);color:#fff;border:0;cursor:pointer;width:auto}
button.sec{background:var(--fram2);color:var(--fram)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--choc);outline-offset:2px}
.cat{margin:22px 0 4px;font-size:19px;color:var(--roxo);border-bottom:2px solid var(--pist2);padding-bottom:4px}
.cat small{color:var(--cinza);font-weight:400;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--pist2)}
.item.baixo .nome{color:var(--alerta)}
.item.aviso .nome{color:#b45309}
.item>b{text-align:right;max-width:48%}
.nome{flex:1;line-height:1.25}
.nome small{display:block;color:var(--cinza);font-size:13px}
.qtd{min-width:52px;text-align:center;font-size:22px;background:#fff;border-radius:12px;padding:7px 4px}
.item button{width:46px;height:46px;padding:0;font-size:26px;line-height:1}
.acoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.box{background:#fff;border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:8px}
.box h3,h3{margin:0 0 2px;font-size:18px}
.row{display:flex;gap:8px}
b,h1,h3{font-weight:400}
label{font-size:14px;color:var(--cinza)}
.chk{width:24px;height:24px;padding:0;flex:none;accent-color:var(--roxo)}
.ciclo{font-size:13px;color:var(--cinza);margin:-2px 0 4px}
.ok{color:#2b8a3e}
.vazio{padding:30px 6px;text-align:center;color:var(--cinza)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--pist2)}
nav button{flex:1;min-width:0;background:none;color:var(--cinza);border-radius:0;padding:9px 0;font-size:11px;line-height:1.3}
nav button.on{color:var(--roxo);box-shadow:inset 0 3px 0 var(--roxo)}
.item2{padding:10px 0;border-bottom:1px solid var(--pist2)}
.item2.baixo .nome{color:var(--alerta)}
.est{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--cinza)}
.est span{flex:1}.est b{font-size:16px;color:var(--choc)}.item2.baixo .est b{color:var(--alerta)}
.est button{height:32px;padding:0 12px;font-size:13px}
.painel{display:flex;gap:8px;align-items:center;margin-top:8px}
.painel button{width:46px;height:44px;padding:0;font-size:24px}
.painel .qtd{flex:1;font-size:20px}
.pedir{display:flex;align-items:center;gap:8px;margin-top:8px;padding:5px 8px;border-radius:12px;background:#fff}
.pedir.on{background:var(--fram2)}
.pedir>span{flex:1;font-size:15px;color:var(--cinza)}.pedir.on>span{color:var(--fram)}
.pedir button{width:44px;height:40px;padding:0;font-size:24px;line-height:1}
.pedir b{min-width:30px;text-align:center;font-size:20px}
.pedbox{background:#fff;border:2px solid var(--fram);border-radius:16px;padding:14px;margin:26px 0 10px}
.pedbox h3{color:var(--fram)}
.pedbox .it{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--pist)}
.pedbox .it span{flex:1}
.big{width:100%;margin-top:12px;padding:15px;font-size:18px}
.ped{background:#fff;border-radius:16px;padding:12px;margin:10px 0}
.ped .top{display:flex;justify-content:space-between;gap:8px}
.ped .top small{color:var(--cinza)}
.ped details{margin-top:8px}.ped summary{cursor:pointer;color:var(--cinza);font-size:14px}
.ped details div{padding:6px 0 0;font-size:14px;color:var(--cinza)}
.areahd{margin:22px 0 4px;padding:8px 12px;border-radius:12px;color:#fff;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chip{flex:none;background:#fff;color:var(--choc);border:2px solid var(--pist2);padding:7px 12px;font-size:14px;border-radius:20px}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.chip[style].on{background:var(--c);border-color:var(--c)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-weight:400;color:var(--cinza);text-align:right;padding:6px 4px;border-bottom:2px solid var(--pist2)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:8px 4px;border-bottom:1px solid var(--pist);text-align:right}
.cmp td.r{color:var(--alerta)}
.rcb{background:#2b8a3e}
</style>
</head>

const qtd = (l, p) => S.est[l + '_' + p] || 0;
const DS = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const hoje0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = d => DS[d.getDay()] + ' ' + d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
const ate = dow => (dow - new Date().getDay() + 7) % 7;
const desde = dow => (new Date().getDay() - dow + 7) % 7;
function ciclo(c) {
  if (!c || c.dia_pedido == null) return null;
  const dp = ate(c.dia_pedido);
  const gap = c.dia_entrega == null ? null : ((c.dia_entrega - c.dia_pedido + 7) % 7 || 7);
  return {dp, de: gap == null ? null : dp + gap, dataPedido: addDias(hoje0(), dp), dataEntrega: gap == null ? null : addDias(hoje0(), dp + gap)};
}
const cons = (l, p) => { const x = S.cons[l + '_' + p]; return x && x.saida > 0 ? x.saida / x.dias : 0; };
const diasRest = (l, p) => { const c = cons(l, p); return c > 0 ? qtd(l, p) / c : null; };
const lojaNome = () => S.lojas.find(l => l.id == S.loja)?.nome || '';

async function carregar() {
  const r = await Promise.all([
    sb.from('lojas').select('*').order('nome'),
    sb.from('categorias').select('*').order('nome'),
    sb.from('produtos').select('*').eq('ativo', true).order('nome'),
    sb.from('estoque').select('*'),
    sb.from('perfis').select('*').maybeSingle(),
    sb.from('movimentos').select('id,delta,usuario,criado_em,lojas(nome),produtos(nome,unidade)').eq('cancelado', false).order('criado_em', {ascending:false}).limit(300),
    sb.from('v_consumo').select('*'),
    sb.from('pedidos').select('id,loja_id,categoria_id,valor,itens,usuario,emitido_por,criado_em,area,recebido,recebido_em,recebido_por,lojas(nome),categorias(nome,area,tipo)').eq('cancelado', false).order('criado_em', {ascending:false}).limit(150),
    sb.from('carrinho').select('*')
  ]);
  const err = r.slice(0, 4).find(x => x.error);
  if (err) return alert('Erro ao carregar: ' + err.error.message);
  [S.lojas, S.cats, S.prods] = [r[0].data, r[1].data, r[2].data];
  S.est = {};
  r[3].data.forEach(x => S.est[x.loja_id + '_' + x.produto_id] = Number(x.qtd));
  S.papel = r[4].data?.papel ?? null;
  const em = (await sb.auth.getSession()).data.session?.user?.email || '';
  S.nome = r[4].data?.nome || (em.split('@')[0].charAt(0).toUpperCase() + em.split('@')[0].slice(1));
  S.hist = r[5].data || [];
  S.cons = {};
  (r[6].data || []).forEach(x => S.cons[x.loja_id + '_' + x.produto_id] = {saida: Number(x.saida || 0), dias: Number(x.dias || 1)});
  S.pedidos = r[7].data || [];
  if (r[7].error || r[5].error) alert('Falta rodar a atualização 7 no banco (atualizacao-7.sql).');
  S.cart = {};
  (r[8].data || []).forEach(x => S.cart[x.loja_id + '_' + x.produto_id] = Number(x.qtd));
  if (r[8].error) alert('Falta rodar a atualização 3 no banco (atualizacao-3.sql).');
  if (!S.lojas.find(l => l.id == S.loja)) S.loja = S.lojas[0]?.id ?? null;
  render();
}

const areaCat = c => c ? (c.area || (c.tipo == 'sorvete' || /^Grupo MAR/.test(c.fornecedor || '') ? 'sorvete' : 'outros')) : 'outros';

const cartQ = (l, p) => S.cart[l + '_' + p] || 0;
const catDe = p => S.cats.find(c => c.id == p.categoria_id) || null;

function itemHtml(p) {

const ed = pid => { S.ed.has(pid) ? S.ed.delete(pid) : S.ed.add(pid); refrescar(); };
async function setCart(pid, delta) {

/* PDF-INI */
function montarPdf(J, o) {
  const doc = new J({unit: 'mm', format: 'a4'});
  const W = 210, M = 14, FIM = 276;
  const roxo = [131, 78, 158], claro = [246, 238, 250], cinza = [105, 95, 115];
  let y = 0;
  const cabecalho = () => {
    doc.setFillColor(...roxo); doc.rect(0, 0, W, 5, 'F');
    if (o.logo) { try { const pr = doc.getImageProperties(o.logo); const w = 38; doc.addImage(o.logo, 'PNG', M, 11, w, w * pr.height / pr.width); } catch (e) {} }
    doc.setTextColor(40, 25, 55); doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.text(o.titulo, W - M, 22, {align: 'right'});
    doc.setFontSize(13); doc.text('Pedido do dia ' + o.data, W - M, 30, {align: 'right'});
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...cinza); doc.text('Loja: ' + o.loja, W - M, 36.5, {align: 'right'});
    y = 52;
  };
  const colunas = () => {
    doc.setFillColor(...claro); doc.rect(M, y, W - 2 * M, 6.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...roxo);
    doc.text('Item', M + 2, y + 4.4); doc.text('Qtd.', 160, y + 4.4, {align: 'right'}); doc.text('Unidade', 165, y + 4.4);
    y += 6.5;
  };
  const catCab = g => {
    doc.setFillColor(...roxo); doc.rect(M, y, W - 2 * M, 8, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text(g.nome, M + 2.5, y + 5.5);
    y += 8; colunas();
  };
  cabecalho();
  o.grupos.forEach(g => {
    if (y + 8 + 6.5 + 8 > FIM) { doc.addPage(); cabecalho(); }
    catCab(g);
    g.itens.forEach((it, i) => {
      const linhas = doc.splitTextToSize(it.nome, 130);
      const h = Math.max(7, linhas.length * 4.4 + 2.6);
      if (y + h > FIM) { doc.addPage(); cabecalho(); catCab({...g, nome: g.nome + ' (cont.)'}); }
      if (i % 2) { doc.setFillColor(251, 248, 253); doc.rect(M, y, W - 2 * M, h, 'F'); }
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(40, 25, 55);
      doc.text(linhas, M + 2, y + 4.8);
      doc.text(String(it.qtd).replace('.', ','), 160, y + 4.8, {align: 'right'});
      doc.text(String(it.un), 165, y + 4.8);
      y += h;
    });
    doc.setDrawColor(...roxo); doc.setLineWidth(0.3); doc.line(M, y, W - M, y);
    y += 9;
  });
  if (y + 24 > FIM) { doc.addPage(); cabecalho(); }
  y += 8;
  doc.setTextColor(40, 25, 55); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Emitido por: ' + o.usuario, M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...cinza); doc.text('em ' + o.emitido, M, y + 5.5);
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(8.5); doc.setTextColor(...cinza); doc.setFont('helvetica', 'normal');
    doc.setDrawColor(220, 205, 232); doc.setLineWidth(0.2); doc.line(M, 285, W - M, 285);
    doc.text('Doce Gelato - Controle de estoque', M, 290); doc.text('Página ' + i + ' de ' + n, W - M, 290, {align: 'right'});
  }
  return doc;
}
/* PDF-FIM */

function abrirPdf(opts, nome) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { alert('Não consegui carregar o gerador de PDF. Confira a internet e tente de novo.'); return false; }
  const doc = montarPdf(J, {...opts, logo: typeof LOGO !== 'undefined' ? LOGO : null});
  const arq = new File([doc.output('blob')], nome, {type: 'application/pdf'});
  if (navigator.canShare && navigator.canShare({files: [arq]})) navigator.share({files: [arq], title: nome}).catch(e => { if (e.name != 'AbortError') doc.save(nome); });
  else doc.save(nome);
  return true;
}
const p2 = n => String(n).padStart(2, '0');

const pdfNome = (d, t) => 'Pedido-' + (t || '') + d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '.pdf';
const pdfOpts = (grupos, d, loja, por, titulo) => ({titulo, loja, usuario: por || 'Usuário',
  data: d.toLocaleDateString('pt-BR'), emitido: dataHora(d), grupos});
const slug = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
async function gerarPedido(tipo, area) {
  const it = cartItens(tipo).filter(x => !area || areaCat(x.c) == area);
  if (!it.length) return alert('Marque os itens que quer pedir.');
  const ak = [...new Set(it.map(x => areaCat(x.c)))], multi = ak.length > 1;
  const ordem = c => AREAS.findIndex(a => a.k == areaCat(c));
  const grupos = [...new Set(it.map(x => x.c))].sort((a, b) => ordem(a) - ordem(b)).map(c => ({c, nome: (multi ? areaInfo(areaCat(c)).n + ' - ' : '') + (c ? c.nome : 'Sem categoria'),
    itens: it.filter(x => x.c == c).map(x => ({nome: x.p.nome, qtd: x.n, un: x.p.unidade, preco: Number(x.p.preco), pid: x.p.id}))}));
  const titulo = multi ? 'Pedido Total' : 'Pedido de ' + areaInfo(ak[0]).n;
  const jaFeito = grupos.filter(g => feitoNoCiclo(g.c)).map(g => g.nome);
  if (!confirm('Gerar: ' + titulo + ' (' + it.length + ' ' + (it.length == 1 ? 'item' : 'itens') + ')?\nEle vai para a aba Pedidos e esses itens saem da lista.' + (jaFeito.length ? '\n\nAtenção: já existe pedido neste ciclo para: ' + jaFeito.join(', ') + '.' : ''))) return;
  const d = new Date();
  if (!abrirPdf(pdfOpts(grupos, d, lojaNome(), S.nome, titulo), pdfNome(d, (multi ? 'Total' : slug(areaInfo(ak[0]).n)) + '-'))) return;
  const linhas = grupos.map(g => ({loja_id: S.loja, categoria_id: g.c ? g.c.id : null, area: areaCat(g.c), valor: g.itens.reduce((a, i) => a + i.qtd * i.preco, 0), emitido_por: S.nome || null,
    itens: g.itens.map(i => ({pid: i.pid, produto: i.nome, qtd: i.qtd, unidade: i.un, preco: i.preco}))}));
  const r1 = await sb.from('pedidos').insert(linhas);
  if (r1.error) return alert('O PDF foi gerado, mas o pedido NÃO foi registrado: ' + r1.error.message + '\n(Você rodou a atualização 7?)');
  await sb.from('carrinho').delete().eq('loja_id', S.loja).in('produto_id', it.map(x => x.p.id));
  S.aba = 'pedidos';
  carregar();
  scrollTo(0, 0);
}
function agrupar() {
  const m = new Map();
  S.pedidos.forEach(p => {
    const k = p.loja_id + '|' + p.criado_em;
    if (!m.has(k)) m.set(k, {k, t: p.criado_em, loja_id: p.loja_id, loja: p.lojas?.nome || '', por: p.emitido_por || (p.usuario || '').split('@')[0], rows: [], valor: 0});
    const g = m.get(k); g.rows.push(p); g.valor += Number(p.valor || 0);
  });
  return [...m.values()];
}
const areaRow = r => r.area || areaCat(r.categorias);
const areasDe = g => [...new Set(g.rows.map(areaRow))].sort((a, b) => AREAS.findIndex(x => x.k == a) - AREAS.findIndex(x => x.k == b));
function pdfPedido(i) {
  const g = S.pedidosAg[i], d = new Date(g.t), ak = areasDe(g), multi = ak.length > 1;
  abrirPdf(pdfOpts(g.rows.map(r => ({nome: (multi ? areaInfo(areaRow(r)).n + ' - ' : '') + (r.categorias?.nome || 'Sem categoria'),
    itens: (r.itens || []).map(x => ({nome: x.produto, qtd: x.qtd, un: x.unidade}))})), d, g.loja, g.por, multi ? 'Pedido Total' : 'Pedido de ' + areaInfo(ak[0]).n),
    pdfNome(d, (multi ? 'Total' : slug(areaInfo(ak[0]).n)) + '-'));
}
async function cancelarPedido(i) {
  if (!confirm('Cancelar este pedido?\nEle some da lista, mas fica guardado no banco.')) return;
  const {error} = await sb.rpc('cancelar_registro', {p_tabela: 'pedidos', p_ids: S.pedidosAg[i].rows.map(r => r.id)});
  error ? alert(error.message) : carregar();
}
function recPainel(g, i) {
  return `<div class="box" style="margin:10px 0 0"><h3>Conferir recebimento</h3><div class="ciclo">Digite o que chegou de verdade em cada item. O que chegou é somado ao estoque.</div>` +
    g.rows.map(r => (r.itens || []).map(x => x.pid ? `<div class="item"><div class="nome">${esc(x.produto)}<small>pedido: ${x.qtd} ${esc(x.unidade)}</small></div><input class="rc" type="number" inputmode="decimal" min="0" step="any" data-k="${r.id}:${x.pid}" value="${x.qtd}" style="width:90px"></div>`
      : `<div class="ciclo">${esc(x.produto)}: pedido antigo, lance no estoque manualmente.</div>`).join('')).join('') +
    `<div class="acoes"><button class="big rcb" onclick="confirmarRec(${i})">Confirmar recebimento</button><button class="sec" onclick="S.rec=null;render()">Voltar</button></div></div>`;
}
async function confirmarRec(i) {
  const g = S.pedidosAg[i], q = {};
  document.querySelectorAll('.rc').forEach(e => { q[e.dataset.k] = Math.max(0, +String(e.value).replace(',', '.') || 0); });
  if (!confirm('Confirmar o recebimento? As quantidades serão somadas ao estoque de ' + g.loja + '.')) return;
  const {error} = await sb.rpc('receber_pedido', {p_ids: g.rows.map(r => r.id), p_qtds: q});
  if (error) return alert(error.message + '\n(Você rodou a atualização 7?)');
  S.rec = null; carregar();
}
function cartaoPedido(g, i) {
  const f = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  const dona = S.papel == 'dona', col = S.papel == 'colaboradora', rec = g.rows[0].recebido_em, ak = areasDe(g);
  const itens = g.rows.map(r => '<b style="color:var(--choc)">' + esc(areaInfo(areaRow(r)).e + ' ' + (r.categorias?.nome || 'Sem categoria')) + '</b><br>' + (r.itens || []).map(x => {
    const rv = rec && r.recebido && x.pid != null ? r.recebido[x.pid] : null;
    return esc(x.produto) + ': ' + x.qtd + ' ' + esc(x.unidade) + (rv != null ? (Number(rv) == Number(x.qtd) ? ' · recebido ✔' : ' · <b style="color:var(--alerta)">recebeu ' + rv + '</b>') : '');
  }).join('<br>')).join('<br><br>');
  const btn = [];
  if (!rec && S.papel != 'dono') btn.push(`<button class="rcb" onclick="S.rec='${g.k}';render()">Conferir recebimento</button>`);
  btn.push(`<button class="sec" onclick="pdfPedido(${i})">Baixar PDF</button>`);
  if (dona && !rec) btn.push(`<button class="sec" onclick="cancelarPedido(${i})">Cancelar</button>`);
  return `<div class="ped"><div class="top"><div><b>${f(g.t)} · ${esc(g.loja)}</b><br><small>${ak.map(k => areaInfo(k).e + ' ' + areaInfo(k).n).join(' · ')} · por ${esc(g.por)}</small></div><b>${col ? '' : R(g.valor)}</b></div>
    <div class="ciclo" style="margin:6px 0 0">${rec ? '<span class="ok">✔ Recebido em ' + f(rec) + '</span>' : 'Aguardando recebimento'}${col ? '' : ' · valor estimado'}</div>
    <details><summary>Ver itens</summary><div>${itens}</div></details>
    ${S.rec == g.k && !rec ? recPainel(g, i) : '<div class="acoes">' + btn.join('') + '</div>'}</div>`;
}
function vPedidos() {
  S.pedidosAg = agrupar();
  const and = [], fim = [];
  S.pedidosAg.forEach((g, i) => (g.rows[0].recebido_em ? fim : and).push(cartaoPedido(g, i)));
  return '<h3 style="margin-top:16px">Aguardando recebimento</h3>' + (and.join('') || '<div class="vazio">Nenhum pedido aguardando.<br>Marque itens em <b>Pedir</b> e toque em <b>Gerar pedido</b>.</div>') +
    (fim.length ? '<h3 style="margin-top:22px">Recebidos</h3>' + fim.join('') : '');
}
function vPainel() {
  const L = S.lojas;
  if (!L.length) return '<div class="vazio">Nenhuma loja cadastrada ainda.</div>';
  const lim = addDias(hoje0(), -30), ag = agrupar();
  const st = L.map(l => {
    let baixo = 0, zero = 0, val = 0;
    S.prods.forEach(p => { const q = qtd(l.id, p.id); val += q * p.preco; if (p.minimo > 0 && q <= p.minimo) baixo++; if (p.minimo > 0 && q <= 0) zero++; });
    const ps = ag.filter(g => g.loja_id == l.id && new Date(g.t) >= lim);
    return {baixo, zero, val, lista: Object.keys(S.cart).filter(k => k.startsWith(l.id + '_')).length, np: ps.length, vp: ps.reduce((a, g) => a + g.valor, 0)};
  });
  const th = '<tr><th></th>' + L.map(l => '<th>' + esc(l.nome) + '</th>').join('') + '</tr>';
  const lin = (nome, f, cls) => '<tr><td>' + nome + '</td>' + st.map(x => '<td class="' + (cls && f(x) > 0 ? 'r' : '') + '">' + (typeof f(x) == 'number' && nome.includes('R$') ? R(f(x)) : f(x)) + '</td>').join('') + '</tr>';
  const cmp = `<div class="box"><h3>Comparativo das lojas</h3><table class="cmp">${th}
    ${lin('Itens abaixo do mínimo', x => x.baixo, 1)}${lin('Itens em falta (zerados)', x => x.zero, 1)}${lin('Itens na lista de pedir', x => x.lista)}
    ${lin('Pedidos (30 dias)', x => x.np)}${lin('Valor pedido, estimado (R$)', x => x.vp)}${lin('Valor em estoque, estimado (R$)', x => x.val)}</table></div>`;
  const at = S.prods.filter(p => p.minimo > 0 && L.some(l => qtd(l.id, p.id) <= p.minimo)).slice(0, 40);
  const atencao = `<div class="box"><h3>Itens para atenção</h3>${at.length ? `<table class="cmp"><tr><th>Produto</th>${L.map(l => '<th>' + esc(l.nome) + '</th>').join('')}</tr>` +
    at.map(p => `<tr><td>${esc(p.nome)}<br><small style="color:var(--cinza)">mín. ${p.minimo}</small></td>${L.map(l => { const q = qtd(l.id, p.id); return `<td class="${q <= p.minimo ? 'r' : ''}">${q}</td>`; }).join('')}</tr>`).join('') + '</table>' : '<div class="vazio" style="padding:10px">Tudo acima do mínimo. 🎉</div>'}</div>`;
  const top = S.prods.map(p => ({p, v: L.map(l => S.cons[l.id + '_' + p.id]?.saida || 0)})).filter(x => x.v.some(n => n > 0)).sort((a, b) => b.v.reduce((s, n) => s + n, 0) - a.v.reduce((s, n) => s + n, 0)).slice(0, 8);
  const maisUsados = top.length ? `<div class="box"><h3>Mais usados (30 dias)</h3><table class="cmp"><tr><th>Produto</th>${L.map(l => '<th>' + esc(l.nome) + '</th>').join('')}</tr>${top.map(x => `<tr><td>${esc(x.p.nome)}</td>${x.v.map(n => '<td>' + n + '</td>').join('')}</tr>`).join('')}</table></div>` : '';
  return cmp + atencao + maisUsados + vPrev();
}
function vMov() {
  const dona = S.papel == 'dona';
  const nm = u => { const n = (u || '').split('@')[0]; return n.charAt(0).toUpperCase() + n.slice(1); };
  let dia = '';
  const h = S.hist.map(m => {
    const d = new Date(m.criado_em), dd = d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'2-digit'});
    const cab = dd != dia ? `<div class="cat" style="font-size:16px;text-transform:capitalize">${dd}</div>` : '';
    dia = dd;
    const sai = m.delta < 0, n = Math.abs(m.delta);
    return cab + `<div class="item"><div class="nome">${esc(m.produtos?.nome)}<small>${nm(m.usuario)} ${sai ? 'deu baixa de' : 'lançou entrada de'} ${n} · ${esc(m.lojas?.nome)} · ${p2(d.getHours())}:${p2(d.getMinutes())}</small></div>
      <b class="${sai ? '' : 'ok'}">${sai ? '−' : '+'}${n}</b>${dona ? `<button class="sec" aria-label="Cancelar registro" onclick="cancelarMov(${m.id})">✖</button>` : ''}</div>`;
  }).join('');
  return '<h3 style="margin-top:16px">Movimentos do estoque</h3><div class="ciclo">Quem deu baixa ou entrada, e quando. Cancelar um registro o tira da lista, mas ele fica guardado. O estoque não muda.</div>' +
    (h || '<div class="vazio">Nenhuma movimentação ainda.</div>');
}
async function cancelarMov(id) {
  if (!confirm('Cancelar este registro?\nEle some da lista, mas fica guardado. O estoque não muda.')) return;
  const {error} = await sb.rpc('cancelar_registro', {p_tabela: 'movimentos', p_ids: [id]});
  error ? alert(error.message) : carregar();
}
async function csv(vista, arquivo) {
  const {data, error} = await sb.from(vista).select('*');
  if (error) return alert(error.message);
  if (!data.length) return alert('Nada para exportar ainda.');
  const cols = Object.keys(data[0]);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const txt = '\ufeff' + [cols.join(';')].concat(data.map(r => cols.map(c => q(typeof r[c] == 'object' && r[c] ? JSON.stringify(r[c]) : r[c])).join(';'))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'}));
  a.download = arquivo + '.csv'; a.click();
}

/* ---------- Cadastro ---------- */
function listaProd() {
  const b = (S.busca || '').toLowerCase().trim();
  const ps = S.prods.filter(p => (!S.fcat || (S.fcat == 'null' ? p.categoria_id == null : p.categoria_id == S.fcat)) && (!b || p.nome.toLowerCase().includes(b)));
  S.vis = ps.map(p => p.id);
  return `<div class="ciclo">${ps.length} produtos na lista</div>` + ps.map(p => `<div class="item"><input type="checkbox" class="chk" aria-label="Marcar" ${S.sel.has(p.id) ? 'checked' : ''} onchange="selProd(${p.id}, this.checked)">
      <div class="nome">${esc(p.nome)}<small>${R(p.preco)} · ${esc(p.unidade)} · mínimo ${p.minimo} · ideal ${p.ideal}</small></div>
      <button class="sec" aria-label="Editar" onclick="editar(${p.id})">✎</button><button class="sec" aria-label="Remover" onclick="remover(${p.id})">🗑</button></div>`).join('');
}
function vCad() {
  const e = S.edit || {}, ec = S.editCat || {};
  const optDia = v => '<option value="">Não definido</option>' + DIAS.map((d, i) => `<option value="${i}" ${v != null && v == i ? 'selected' : ''}>${d}</option>`).join('');
  return `<div class="box"><h3>Exportar para o Power BI</h3><div class="ciclo">Baixa uma planilha CSV (abre no Excel e no Power BI).</div><div class="acoes" style="margin:0"><button class="sec" onclick="csv('v_estoque','estoque')">Estoque</button><button class="sec" onclick="csv('v_pedidos','pedidos')">Pedidos</button><button class="sec" onclick="csv('v_consumo','consumo')">Consumo</button></div></div>
    <div class="box"><h3>Lojas</h3>${S.lojas.map(l => `<div class="item"><div class="nome">${esc(l.nome)}</div><button class="sec" aria-label="Excluir loja" onclick="removerLoja(${l.id})">🗑</button></div>`).join('') || 'Nenhuma ainda'}
      <div class="row"><input id="nl" placeholder="Nome da loja"><button onclick="addLoja()">Adicionar</button></div></div>
    <div class="box"><h3>Categorias</h3>${S.cats.map(c => `<div class="item"><div class="nome">${esc(c.nome)}<small>${areaInfo(areaCat(c)).e} ${areaInfo(areaCat(c)).n} · ${c.dia_pedido != null ? 'pedido ' + DS[c.dia_pedido] : 'sem dia de pedido'}${c.dia_entrega != null ? ' · entrega ' + DS[c.dia_entrega] : ''}</small></div><button class="sec" aria-label="Editar categoria" onclick="editarCat(${c.id})">✎</button><button class="sec" aria-label="Excluir categoria" onclick="removerCat(${c.id})">🗑</button></div>`).join('') || 'Nenhuma ainda'}
      <h3 style="margin-top:10px">${ec.id ? 'Editar categoria' : 'Nova categoria'}</h3>
      <div class="row"><input id="nc" placeholder="Categoria" value="${esc(ec.nome)}"></div>
      <label>Área desta categoria</label><select id="tp">${AREAS.map(a => `<option value="${a.k}" ${areaCat(ec.id ? ec : {area: 'outros'}) == a.k ? 'selected' : ''}>${a.e} ${a.n}</option>`).join('')}</select>
      <label>Dia de enviar o pedido</label><select id="dp">${optDia(ec.dia_pedido)}</select>
      <label>Dia da entrega</label><select id="de">${optDia(ec.dia_entrega)}</select>
      <div class="row"><button onclick="salvarCat()">Salvar categoria</button>${ec.id ? '<button class="sec" onclick="S.editCat=null;render()">Cancelar</button>' : ''}</div></div>
    <div class="box"><h3>${e.id ? 'Editar produto' : 'Novo produto'}</h3>
      <input id="pn" placeholder="Nome do produto" value="${esc(e.nome)}">
      <select id="pc">${S.cats.map(c => `<option value="${c.id}" ${c.id == e.categoria_id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
      <div class="row"><input id="pu" placeholder="Unidade (un, kg, cx)" value="${esc(e.unidade || 'un')}"><input id="pp" type="number" step="0.01" inputmode="decimal" placeholder="Preço R$" value="${e.preco ?? ''}"></div>
      <div class="row"><input id="pm" type="number" inputmode="decimal" placeholder="Estoque mínimo" value="${e.minimo ?? ''}"><input id="pi" type="number" inputmode="decimal" placeholder="Estoque ideal" value="${e.ideal ?? ''}"></div>
      <div class="row"><button onclick="salvarProd()">Salvar produto</button>${e.id ? '<button class="sec" onclick="S.edit=null;render()">Cancelar</button>' : ''}</div></div>
    <h3>Produtos (${S.prods.length})</h3>
    <div class="box"><input id="bp" type="search" placeholder="Buscar produto" value="${esc(S.busca)}" oninput="filtrarProd()">
      <select id="fc" onchange="filtrarProd()"><option value="">Todas as categorias</option>${S.cats.map(c => `<option value="${c.id}" ${S.fcat == c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}<option value="null" ${S.fcat == 'null' ? 'selected' : ''}>Sem categoria</option></select>
      <div class="row"><button class="sec" onclick="selTodos()">Marcar todos da lista</button><button class="sec" onclick="S.sel.clear();filtrarProd()">Desmarcar</button></div>
      <button id="brs" onclick="removerSel()">Remover marcados (${S.sel.size})</button></div>
    <div id="lp">${listaProd()}</div>`;
}
function filtrarProd() { S.busca = $('#bp').value; S.fcat = $('#fc').value; $('#lp').innerHTML = listaProd(); }
const updSel = () => { const b = $('#brs'); if (b) b.textContent = 'Remover marcados (' + S.sel.size + ')'; };
function selProd(id, on) { on ? S.sel.add(id) : S.sel.delete(id); updSel(); }
function selTodos() { S.vis.forEach(id => S.sel.add(id)); $('#lp').innerHTML = listaProd(); updSel(); }
async function removerSel() {
  const ids = [...S.sel];
  if (!ids.length) return alert('Marque os produtos que quer remover.');
  if (!confirm('Remover ' + ids.length + ' produto(s)? O histórico de movimentações é mantido.')) return;
  const {error} = await sb.from('produtos').update({ativo: false}).in('id', ids);
  if (error) return alert(error.message);
  S.sel.clear(); carregar();
}
function removerLoja(id) {
  const l = S.lojas.find(x => x.id == id);
  if (confirm('Excluir a loja "' + l.nome + '"? O estoque dela será apagado.')) run(sb.from('lojas').delete().eq('id', id));
}
async function removerCat(id) {
  const c = S.cats.find(x => x.id == id), n = S.prods.filter(p => p.categoria_id == id).length;
  if (!confirm('Excluir a categoria "' + c.nome + '"' + (n ? ' e os ' + n + ' produtos dela' : '') + '?')) return;
  if (n) { const r = await sb.from('produtos').update({ativo: false}).eq('categoria_id', id); if (r.error) return alert(r.error.message); }
  run(sb.from('categorias').delete().eq('id', id));
}
async function run(q) { const {error} = await q; error ? alert(error.message) : carregar(); }
const addLoja = () => { const n = $('#nl').value.trim(); if (n) run(sb.from('lojas').insert({nome: n})); };
function salvarCat() {
  const nome = $('#nc').value.trim();
  if (!nome) return alert('Digite o nome da categoria.');
  const dia = id => $(id).value === '' ? null : +$(id).value;
  const o = {nome, dia_pedido: dia('#dp'), dia_entrega: dia('#de')};
  o.area = $('#tp').value; o.tipo = o.area == 'sorvete' ? 'sorvete' : 'geral';
  const id = S.editCat?.id; S.editCat = null;
  run(id ? sb.from('categorias').update(o).eq('id', id) : sb.from('categorias').insert(o));
}
const editarCat = id => { S.editCat = S.cats.find(c => c.id == id); render(); scrollTo(0, 0); };
function salvarProd() {
  const o = {nome: $('#pn').value.trim(), categoria_id: +$('#pc').value || null, unidade: $('#pu').value.trim() || 'un',
    preco: +$('#pp').value || 0, minimo: +$('#pm').value || 0, ideal: +$('#pi').value || 0};
  if (!o.nome) return alert('Digite o nome do produto.');
  const id = S.edit?.id; S.edit = null;
  run(id ? sb.from('produtos').update(o).eq('id', id) : sb.from('produtos').insert(o));
}
const editar = id => { S.edit = S.prods.find(p => p.id == id); render(); scrollTo(0, 0); };
const remover = id => { if (confirm('Remover este produto?')) run(sb.from('produtos').update({ativo: false}).eq('id', id)); };

/* ---------- Login ---------- */
function telaLogin() {
  $('#h').hidden = $('#n').hidden = true;
  $('#m').innerHTML = `<img class="logo-login" src="${LOGO}" alt="Doce Estoque"><div class="box" style="margin-top:20px"><h3>Entrar no estoque</h3>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="se" type="password" placeholder="Senha" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button></div>`;
}
async function entrar() {
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#se').value});
  error ? alert('E-mail ou senha incorretos.') : carregar();
}
const sair = () => sb.auth.signOut().then(telaLogin);

document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#h').hidden && S.aba != 'cad') carregar(); });
sb.auth.getSession().then(({data}) => data.session ? carregar() : telaLogin());
</script>
