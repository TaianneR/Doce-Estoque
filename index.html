<style>
:root{--roxo:#834e9e;--fram:#e93388;--fram2:#fde3f0;--pist:#f6eefa;--pist2:#d8c1e6;--choc:#2d1a38;--cinza:#76677f;--alerta:#c92a2a}
*{box-sizing:border-box}
body{margin:0;font-family:'Century Gothic',CenturyGothic,AppleGothic,Questrial,system-ui,sans-serif;font-synthesis:none;background:var(--pist);color:var(--choc);padding-bottom:76px;font-size:16px}
header{background:#fff;color:var(--choc);padding:8px 12px;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;border-bottom:3px solid var(--roxo)}
header img{height:44px;width:auto}
header select{flex:1;min-width:0;border:1.5px solid var(--pist2)}
.logo-login{display:block;margin:34px auto 0;width:210px;max-width:70%}
main{padding:6px 14px 20px;max-width:680px;margin:auto}
input,select,button{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid #c9d8bd;background:#fff;color:var(--choc);width:100%}
button{background:var(--fram);color:#fff;border:0;cursor:pointer;width:auto}
button.sec{background:var(--fram2);color:var(--fram)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--choc);outline-offset:2px}
.cat{margin:22px 0 4px;font-size:19px;color:var(--roxo);border-bottom:2px solid var(--pist2);padding-bottom:4px}
.cat small{color:var(--cinza);font-weight:400;font-size:14px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #d3e2c8}
.item.baixo .nome{color:var(--alerta)}
.item.baixo .qtd{background:var(--alerta);color:#fff}
.nome{flex:1;line-height:1.25}
.nome small{display:block;color:var(--cinza);font-size:13px}
.qtd{min-width:52px;text-align:center;font-size:22px;background:#fff;border-radius:12px;padding:7px 4px;cursor:pointer}
.item button{width:46px;height:46px;padding:0;font-size:26px;line-height:1}
.total{background:var(--roxo);color:#fff;border-radius:16px;padding:16px;margin:14px 0;font-size:20px}
.total small{display:block;opacity:.75;font-size:13px}
.acoes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.box{background:#fff;border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:8px}
.box h3,h3{margin:0 0 2px;font-size:18px}
.row{display:flex;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--pist2)}
b,h1,h3{font-weight:400}
nav button{flex:1;background:none;color:var(--cinza);border-radius:0;padding:14px 0;font-size:13px}
nav button.on{color:var(--roxo);box-shadow:inset 0 3px 0 var(--roxo)}
.vazio{padding:30px 6px;text-align:center;color:var(--cinza)}
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

};

const qtd = (l, p) => S.est[l + '_' + p] || 0;
const lojaNome = () => S.lojas.find(l => l.id == S.loja)?.nome || '';

async function carregar() {
  const r = await Promise.all([
    sb.from('lojas').select('*').order('nome'),
    sb.from('categorias').select('*').order('nome'),
    sb.from('produtos').select('*').eq('ativo', true).order('nome'),
    sb.from('estoque').select('*'),
    sb.from('perfis').select('papel').maybeSingle(),
    sb.from('movimentos').select('delta,usuario,criado_em,lojas(nome),produtos(nome)').order('criado_em', {ascending:false}).limit(100)
  ]);
  const err = r.find(x => x.error);
  if (err) return alert('Erro ao carregar: ' + err.error.message);
  [S.lojas, S.cats, S.prods] = [r[0].data, r[1].data, r[2].data];
  S.est = {};
  r[3].data.forEach(x => S.est[x.loja_id + '_' + x.produto_id] = Number(x.qtd));
  S.papel = r[4].data?.papel ?? null;
  S.hist = r[5].data || [];
  if (!S.lojas.find(l => l.id == S.loja)) S.loja = S.lojas[0]?.id ?? null;
  render();
}

function render() {
  if (!S.papel) {
    $('#h').hidden = $('#n').hidden = true;

    return;

  const abas = ABAS[S.papel];

  $('#h').hidden = $('#n').hidden = false;
  $('#h').innerHTML = `<img src="${LOGO}" alt="Doce Gelato">
    <select aria-label="Loja" onchange="S.loja=+this.value;render()">${S.lojas.map(l => `<option value="${l.id}" ${l.id == S.loja ? 'selected' : ''}>${esc(l.nome)}</option>`).join('')}</select>
    <button class="sec" onclick="sair()">Sair</button>`;
  $('#n').innerHTML = abas.map(([k, t]) => `<button class="${S.aba == k ? 'on' : ''}" onclick="S.aba='${k}';render();scrollTo(0,0)">${t}</button>`).join('');
  $('#m').innerHTML = {estoque: vEstoque, pedido: vPedido, hist: vHist, cad: vCad}[S.aba]();
}

/* ---------- Estoque ---------- */
function vEstoque() {
  if (!S.loja) return '<div class="vazio">Nenhuma loja cadastrada ainda.</div>';
  const pode = S.papel != 'dono', ver = S.papel != 'colaboradora';
  const h = CATS().map(c => {
    const ps = S.prods.filter(p => p.categoria_id == c.id);
    if (!ps.length) return '';
    return `<div class="cat">${esc(c.nome)}</div>` + ps.map(p => {
      const q = qtd(S.loja, p.id);
      return `<div class="item ${q <= p.minimo ? 'baixo' : ''}">
        <div class="nome">${esc(p.nome)}<small>${ver ? R(p.preco) + ' · ' : ''}${esc(p.unidade)} · mínimo ${p.minimo}</small></div>
        ${pode ? `<button class="sec" aria-label="Dar baixa" onclick="aj(${p.id},-1)">−</button>` : ''}
        <div class="qtd" ${pode ? `title="Toque para contar o estoque" onclick="ajExato(${p.id})"` : ''}>${q}</div>
        ${pode ? `<button aria-label="Entrada" onclick="aj(${p.id},1)">+</button>` : ''}</div>`;
    }).join('');
  }).join('');
  return h || '<div class="vazio">Nenhum produto cadastrado ainda.</div>';
}

function vHist() {
  const f = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  return '<h3 style="margin-top:16px">Últimas movimentações</h3>' + (S.hist.map(m =>
    `<div class="item"><div class="nome">${esc(m.produtos?.nome)}<small>${esc(m.lojas?.nome)} · ${esc((m.usuario || '').split('@')[0])} · ${f(m.criado_em)}</small></div><b>${m.delta > 0 ? '+' : ''}${m.delta}</b></div>`).join('')
    || '<div class="vazio">Nenhuma movimentação ainda.</div>');
}

async function aj(pid, d) {
  const k = S.loja + '_' + pid, ant = qtd(S.loja, pid);
  if (ant + d < 0) return;
  S.est[k] = ant + d; render();
  const {error} = await sb.rpc('ajustar_estoque', {p_loja: S.loja, p_produto: pid, p_delta: d});
  if (error) { S.est[k] = ant; render(); alert('Não salvou: ' + error.message); }
}
function ajExato(pid) {
  const v = prompt('Quantidade em estoque agora:', qtd(S.loja, pid));
  if (v === null || v.trim() === '' || isNaN(+v.replace(',', '.')) || +v.replace(',', '.') < 0) return;
  const d = +v.replace(',', '.') - qtd(S.loja, pid);
  if (d) aj(pid, d);
}

/* ---------- Pedido ---------- */
function itensPedido() {
  return S.prods.map(p => ({p, q: qtd(S.loja, p.id)}))
    .filter(x => x.q <= x.p.minimo && x.p.ideal > x.q)
    .map(x => ({...x, n: x.p.ideal - x.q}));
}
function vPedido() {
  if (!S.loja) return '<div class="vazio">Cadastre uma loja primeiro.</div>';
  const it = itensPedido();
  let tot = 0;
  const h = CATS().map(c => {
    const xs = it.filter(x => x.p.categoria_id == c.id);
    if (!xs.length) return '';
    const sub = xs.reduce((a, x) => a + x.n * x.p.preco, 0);
    tot += sub;
    return `<div class="cat">${esc(c.nome)} <small>${c.fornecedor ? esc(c.fornecedor) + ' · ' : ''}${R(sub)}</small></div>` +
      xs.map(x => `<div class="item"><div class="nome">${esc(x.p.nome)}<small>tem ${x.q} · mínimo ${x.p.minimo}</small></div><b>${x.n} ${esc(x.p.unidade)}</b></div>`).join('');
  }).join('');
  return `<div class="total"><small>${esc(lojaNome())} · estimativa do pedido</small>${R(tot)}</div>` +
    (h || '<div class="vazio">Nada abaixo do mínimo. 🎉</div>') +
    `<div class="acoes"><button onclick="copiar()">Copiar pedido</button><button class="sec" onclick="csv()">Exportar CSV</button></div>`;
}
function copiar() {
  const it = itensPedido();
  const t = CATS().map(c => {
    const xs = it.filter(x => x.p.categoria_id == c.id);
    return xs.length ? `*${c.nome}${c.fornecedor ? ' (' + c.fornecedor + ')' : ''}*\n` + xs.map(x => `- ${x.p.nome}: ${x.n} ${x.p.unidade}`).join('\n') : '';
  }).filter(Boolean).join('\n\n');
  navigator.clipboard.writeText(`Pedido ${lojaNome()}\n\n${t}`).then(() => alert('Pedido copiado. Cole no WhatsApp.'));
}
async function csv() {
  const {data, error} = await sb.from('v_estoque').select('*');
  if (error) return alert(error.message);
  if (!data.length) return alert('Nada para exportar ainda.');
  const cols = Object.keys(data[0]);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const txt = '\ufeff' + [cols.join(';')].concat(data.map(r => cols.map(c => q(r[c])).join(';'))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'}));
  a.download = 'estoque.csv'; a.click();
}

/* ---------- Cadastro ---------- */
function vCad() {
  const e = S.edit || {};
  return `<div class="box"><h3>Lojas</h3>${S.lojas.map(l => esc(l.nome)).join(', ') || 'Nenhuma ainda'}
      <div class="row"><input id="nl" placeholder="Nome da loja"><button onclick="addLoja()">Adicionar</button></div></div>
    <div class="box"><h3>Categorias</h3>${S.cats.map(c => esc(c.nome) + (c.fornecedor ? ' (' + esc(c.fornecedor) + ')' : '')).join(', ') || 'Nenhuma ainda'}
      <div class="row"><input id="nc" placeholder="Categoria"><input id="nf" placeholder="Fornecedor"></div>
      <button onclick="addCat()">Adicionar categoria</button></div>
    <div class="box"><h3>${e.id ? 'Editar produto' : 'Novo produto'}</h3>
      <input id="pn" placeholder="Nome do produto" value="${esc(e.nome)}">
      <select id="pc">${S.cats.map(c => `<option value="${c.id}" ${c.id == e.categoria_id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
      <div class="row"><input id="pu" placeholder="Unidade (un, kg, cx)" value="${esc(e.unidade || 'un')}"><input id="pp" type="number" step="0.01" inputmode="decimal" placeholder="Preço R$" value="${e.preco ?? ''}"></div>
      <div class="row"><input id="pm" type="number" inputmode="decimal" placeholder="Estoque mínimo" value="${e.minimo ?? ''}"><input id="pi" type="number" inputmode="decimal" placeholder="Estoque ideal" value="${e.ideal ?? ''}"></div>
      <div class="row"><button onclick="salvarProd()">Salvar produto</button>${e.id ? '<button class="sec" onclick="S.edit=null;render()">Cancelar</button>' : ''}</div></div>
    <h3>Produtos (${S.prods.length})</h3>` +
    S.prods.map(p => `<div class="item"><div class="nome">${esc(p.nome)}<small>${R(p.preco)} · mínimo ${p.minimo} · ideal ${p.ideal}</small></div>
      <button class="sec" aria-label="Editar" onclick="editar(${p.id})">✎</button><button class="sec" aria-label="Remover" onclick="remover(${p.id})">🗑</button></div>`).join('');
}
async function run(q) { const {error} = await q; error ? alert(error.message) : carregar(); }
const addLoja = () => { const n = $('#nl').value.trim(); if (n) run(sb.from('lojas').insert({nome: n})); };
const addCat = () => { const n = $('#nc').value.trim(); if (n) run(sb.from('categorias').insert({nome: n, fornecedor: $('#nf').value.trim() || null})); };
function salvarProd() {
  const o = {nome: $('#pn').value.trim(), categoria_id: +$('#pc').value || null, unidade: $('#pu').value.trim() || 'un',
    preco: +$('#pp').value || 0, minimo: +$('#pm').value || 0, ideal: +$('#pi').value || 0};
  if (!o.nome) return alert('Digite o nome do produto.');
  const id = S.edit?.id; S.edit = null;
  run(id ? sb.from('produtos').update(o).eq('id', id) : sb.from('produtos').insert(o));
}
const editar = id => { S.edit = S.prods.find(p => p.id == id); render(); scrollTo(0, 0); };
const remover = id => { if (confirm('Remover este produto?')) run(sb.from('produtos').update({ativo: false}).eq('id', id)); };

/* ---------- Login ---------- */
function telaLogin() {
  $('#h').hidden = $('#n').hidden = true;
  $('#m').innerHTML = `<img class="logo-login" src="${LOGO}" alt="Doce Gelato"><div class="box" style="margin-top:20px"><h3>Entrar no estoque</h3>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="se" type="password" placeholder="Senha" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button></div>`;
}
async function entrar() {
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#se').value});
  error ? alert('E-mail ou senha incorretos.') : carregar();
}
const sair = () => sb.auth.signOut().then(telaLogin);

document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#h').hidden && !S.edit) carregar(); });
sb.auth.getSession().then(({data}) => data.session ? carregar() : telaLogin());
</script>
</body>
</html>
